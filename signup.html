<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Studio Account — VOLTARIS</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="images/brand/favicon.svg">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

  <div class="auth-page-wrapper">
    
    <!-- Centered Glass Form Box -->
    <div class="auth-form-card">
      
      <!-- Top Center Brand Logo & Name -->
      <div class="auth-brand-header">
        <a href="index.html" class="auth-brand-logo" aria-label="Voltaris Home">
          <img src="images/brand/logo.svg" alt="VOLTARIS Logo" class="nav-logo-img" width="190" height="44">
        </a>
        <h1 style="font-size:var(--fs-xl); margin-bottom:0.5rem;">Create Account</h1>
        <p style="font-size:var(--fs-sm); color:var(--muted);">Start your 30-day full feature trial.</p>
      </div>

      <form id="signupForm">
        <div class="form-group">
          <label for="signupName" class="form-label">Full Name</label>
          <input type="text" id="signupName" class="form-input" placeholder="e.g. Ronald Vance" required>
        </div>

        <div class="form-group">
          <label for="signupEmail" class="form-label">Work Email</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="r.vance@company.com" required>
        </div>

        <div class="form-group">
          <label for="signupCompany" class="form-label">Company Name</label>
          <input type="text" id="signupCompany" class="form-input" placeholder="Nexus Electronics" required>
        </div>

        <div class="form-group">
          <label for="signupPassword" class="form-label">Master Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="signupPassword" class="form-input" placeholder="Minimum 8 characters" required>
            <button type="button" class="password-toggle-btn" aria-label="Show password" tabindex="-1">
              <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-meta-row" style="margin-block: 1rem 1.5rem; justify-content: flex-start;">
          <label class="auth-checkbox-label" for="signupTerms" style="font-size:0.8125rem; line-height: 1.45; align-items: flex-start; gap: 0.65rem;">
            <input type="checkbox" id="signupTerms" required style="margin-top: 0.2rem;">
            <span>I agree to the <a href="terms.html" target="_blank" class="auth-link-signal">Terms and Conditions</a> and <a href="privacy.html" target="_blank" class="auth-link-signal">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-volt btn-lg" style="width:100%;">Deploy Studio Node</button>
      </form>

      <!-- Social Authentication Options -->
      <div class="auth-divider">
        <span>or register with</span>
      </div>
      <div class="auth-social-grid">
        <button type="button" class="btn-auth-social" data-provider="Google" aria-label="Sign up with Google">
          <svg class="social-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google</span>
        </button>
        <button type="button" class="btn-auth-social" data-provider="Apple" aria-label="Sign up with Apple">
          <svg class="social-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.66-.8 1.11-1.92.99-3.04-1 .04-2.15.67-2.82 1.46-.59.69-1.11 1.83-.97 2.91 1.12.09 2.14-.53 2.8-1.33z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <div class="auth-switch-prompt">
        Already provisioned? <a href="login.html" class="auth-link-volt">Sign In Instead</a>
      </div>

    </div>
  </div>

  <script type="module">
    import { login } from './assets/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signupForm');
      const termsCheckbox = document.getElementById('signupTerms');

      // Password visibility toggle (eye icon)
      document.querySelectorAll('.password-toggle-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const wrapper = btn.closest('.password-input-wrapper');
          const input = wrapper.querySelector('input');
          const eyeOpen = btn.querySelector('.eye-open');
          const eyeClosed = btn.querySelector('.eye-closed');

          if (input.type === 'password') {
            input.type = 'text';
            if (eyeOpen) eyeOpen.style.display = 'none';
            if (eyeClosed) eyeClosed.style.display = 'block';
            btn.setAttribute('aria-label', 'Hide password');
          } else {
            input.type = 'password';
            if (eyeOpen) eyeOpen.style.display = 'block';
            if (eyeClosed) eyeClosed.style.display = 'none';
            btn.setAttribute('aria-label', 'Show password');
          }
        });
      });

      // Social Auth Simulation (Google / Apple)
      document.querySelectorAll('.btn-auth-social').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const provider = btn.dataset.provider || 'Social';
          alert(`Demo notice: Authenticating via ${provider} OAuth... Creating and logging into your trial workspace.`);
          // Auto login as default Admin demo account
          login('admin@voltaris.demo', 'Admin@123');
          window.location.href = 'dashboard.html';
        });
      });

      // Form submission validation
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!termsCheckbox.checked) {
          alert('Please agree to the Terms and Conditions and Privacy Policy to proceed.');
          termsCheckbox.focus();
          return;
        }
        alert('Trial account initialized! Logging you in as Studio Administrator...');
        login('admin@voltaris.demo', 'Admin@123');
        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>

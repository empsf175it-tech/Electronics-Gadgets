<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6FF3D" />
      <stop offset="50%" stop-color="#22E5FF" />
      <stop offset="100%" stop-color="#8B5CFF" />
    </linearGradient>
    <filter id="voltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6FF3D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circuit Trace Background Frame (Hex-accented) -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="rgba(34, 229, 255, 0.25)" stroke-width="1.5" fill="rgba(11, 16, 48, 0.6)"/>
  
  <!-- Subtle Circuit Path Accents -->
  <path d="M12 22 L20 22 L26 28" stroke="rgba(139, 92, 255, 0.4)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="12" cy="22" r="1.5" fill="#8B5CFF"/>
  <path d="M52 22 L44 22 L38 28" stroke="rgba(139, 92, 255, 0.4)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="52" cy="22" r="1.5" fill="#8B5CFF"/>

  <!-- VOLTARIS "V" Monogram with Circuit Trace & Lightning Notch -->
  <path d="M16 16 L27 38 L30 32 L34 32 L32 49 L37 49 L48 16" 
        stroke="url(#voltGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#voltGlow)"/>

  <!-- Lightning Notch Spark Cutout -->
  <path d="M28 32 L35 24 L32 32 L37 32 L31 43 L32 37 Z" fill="#C6FF3D" filter="url(#voltGlow)"/>

  <!-- Glowing Signal Node at the Apex -->
  <circle cx="32" cy="50" r="4" fill="url(#nodeGlow)"/>
  <circle cx="32" cy="50" r="2" fill="#FFFFFF"/>
</svg>

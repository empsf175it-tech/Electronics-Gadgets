<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="vGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6FF3D" />
      <stop offset="50%" stop-color="#22E5FF" />
      <stop offset="100%" stop-color="#8B5CFF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EAF0FF" />
    </linearGradient>
    <filter id="vGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Mark (scaled 48x48) -->
  <g transform="translate(4, 4) scale(0.75)">
    <!-- Hex Frame -->
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" stroke="rgba(34, 229, 255, 0.3)" stroke-width="2" fill="rgba(11, 16, 48, 0.75)"/>
    <!-- Circuit lines -->
    <path d="M12 22 L20 22 L26 28" stroke="rgba(139, 92, 255, 0.6)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="22" r="2" fill="#8B5CFF"/>
    <path d="M52 22 L44 22 L38 28" stroke="rgba(139, 92, 255, 0.6)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="52" cy="22" r="2" fill="#8B5CFF"/>
    <!-- V Circuit Monogram -->
    <path d="M16 16 L27 38 L30 32 L34 32 L32 49 L37 49 L48 16" 
          stroke="url(#vGradFull)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#vGlowFull)"/>
    <!-- Lightning Notch -->
    <path d="M28 32 L35 24 L32 32 L37 32 L31 43 L32 37 Z" fill="#C6FF3D" filter="url(#vGlowFull)"/>
    <!-- Glowing Node -->
    <circle cx="32" cy="50" r="3.5" fill="#C6FF3D" filter="url(#vGlowFull)"/>
    <circle cx="32" cy="50" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography: VOLTARIS -->
  <text x="62" y="34" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="url(#textGrad)">VOLTARIS</text>
  
  
  <!-- Sub-label / Tagline pill -->
  <rect x="63" y="40" width="138" height="11" rx="3" fill="rgba(34, 229, 255, 0.08)" stroke="rgba(34, 229, 255, 0.2)" stroke-width="0.8"/>
  <text x="132" y="48.2" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="2" fill="#22E5FF">GADGET ANALYTICS</text>
</svg>
